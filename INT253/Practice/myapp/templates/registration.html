
<form method='POST'>
    {% csrf_token %}
    <h1>Student Registrations Form</h1>
    <label>Name: </label>
    <input type="text" name="name" placeholder="Name...">

    <label>Email: </label>
    <input type="text" name="email" placeholder="youremail@gmail.com">

    <label>Age: </label>
    <input type="number" name="age">

    <button type="submit">Submit</button>
</form>
